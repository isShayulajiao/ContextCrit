# 复制为 settings.local.yaml，在复制的文件中直接填入真实 Key。
# settings.local.yaml 已被 Git 忽略；不要在本模板填写真实 Key 后提交。
inputs:
  - 'F:/2027申博/博士面试/CultCrit-Bench-main/CultCrit-Bench-main/dataset/test.json'
  # - 'F:/其他目录/另一份完整数据集.json'
agent_config: configs/deepseek.yaml  # 更换答题模型只修改此配置；本地服务示例 configs/local_openai.yaml
max_samples: null  # YAML 中 null 表示全部；521 表示前 521 条；命令行 --max-samples None 表示全部
run_dir: null      # 自动建立输出目录；如需固定路径可填写 runs/experiment_001
judges_config: configs/judges.yaml
api_keys:
  deepseek: ""
  qwen: ""
  minimax: ""
  gemini: ""
  # actor: ""  # 替换其他远端答题模型时，配置中引用 SCOPECRIT_ACTOR_API_KEY
# Qwen 固定华北 2（北京），模型 qwen3.8-flash。
# WorkspaceId 不是 API Key；请从你的业务空间获取，程序不能从 Key 推断。
qwen_workspace_id: ""
# 一般无需填写；如填写完整 HTTPS 地址，则不要同时填写 workspace_id。
qwen_base_url: ""
# MiniMax 与 Gemini 使用同一网关，各自的 Key 可填写相同值或不同值。
minimax_base_url: https://api.apikey.fan/v1
gemini_base_url: https://api.apikey.fan/v1

