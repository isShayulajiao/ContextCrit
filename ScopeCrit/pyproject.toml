[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopecrit"
version = "0.1.0"
description = "范围约束与证据缺口驱动的文学评论 Agent"
requires-python = ">=3.11"
dependencies = ["openai>=1.66,<3", "zai-sdk>=0.2.3,<1", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
scopecrit = "scopecrit.cli:main"

[tool.setuptools.packages.find]
include = ["scopecrit*"]

[tool.setuptools.package-data]
scopecrit = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
