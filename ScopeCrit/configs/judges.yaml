# 三个独立评分裁判；答题 Agent 的 DeepSeek-flash 在 deepseek.yaml 中单独配置。
# 真实 Key、Qwen 业务空间地址和网关覆盖地址在 settings.local.yaml 中填写。
# 本文件通过内部变量名接收本地设置，不要求用户设置环境变量。
enabled: true
workers: 3  # 三个裁判同时工作；每位裁判内部按样本顺序评分
fixture: false
max_api_retries: 2
max_format_repairs: 1
max_input_chars: 120000
judges:
  - name: qwen3.8-flash
    provider: openai
    model: qwen3.8-flash
    # 例如 https://真实WorkspaceId.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    # 必须按账号业务空间和地域设置，程序不会猜测 WorkspaceId。
    base_url_env: DASHSCOPE_BASE_URL
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.0
    # Qwen 自有参数；不使用 DeepSeek 的 thinking.type 结构。
    enable_thinking: false
    response_format_json: false
  - name: minimax-m3.1-flash
    provider: openai
    model: minimax-m3.1-flash
    # 用户指定网关；模型名和可用性以网关账号实际权限为准，不静默替换模型。
    base_url: https://api.apikey.fan/v1
    base_url_env: MINIMAX_BASE_URL
    api_key_env: MINIMAX_API_KEY
    # 未确认该别名的温度取值范围，沿用服务默认值，避免强制传 0 被拒绝。
    # 未确认网关支持 response_format；由评分提示要求 JSON，再执行解析和修复。
    response_format_json: false
  - name: gemini-3.1-flash-lite
    provider: openai
    model: gemini-3.1-flash-lite
    base_url: https://api.apikey.fan/v1
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    temperature: 0.0
    response_format_json: false

